name: monkci-ci
on:
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    name: Lint (ruff)
    runs-on: monkci-ubuntu-24.04-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check --isolated monkci_demo

  test:
    name: Unit tests (py ${{ matrix.python-version }})
    needs: lint
    runs-on: monkci-ubuntu-24.04-2
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install pytest
      - run: python -m pytest monkci_tests -q -o addopts="" -p no:cacheprovider
