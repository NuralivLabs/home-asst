name: monkci-ci
on:
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    name: Lint (ruff)
    runs-on: monkci-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check --isolated monkci_demo

  test:
    name: Unit tests
    needs: lint
    runs-on: monkci-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: python -m pytest monkci_tests -q -o addopts="" -p no:cacheprovider
